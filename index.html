<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lovers' Board Game</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#24162b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lovers' Game">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#24162b; --surface:#33203b; --surface2:#432a4c; --ink:#f6e9ee; --dim:#c5aebb;
  --line:rgba(246,233,238,.18); --rose:#e59aa6; --gold:#e8b86d; --onaccent:#2a1430;
  --wood:#5b3a34; --wood2:#4d302b; --felt:#3a2242;
  --p0:#e8b86d; --p1:#e59aa6;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7edf0; --surface:#fff8f9; --surface2:#f1dfe5; --ink:#2b1830; --dim:#6d5573;
    --line:rgba(43,24,48,.18); --rose:#b0435b; --gold:#9a6a17; --onaccent:#fff8f9;
    --wood:#b98f74; --wood2:#a98066; --felt:#ead3dc; --p0:#9a6a17; --p1:#b0435b;
  }
}
:root[data-theme="light"]{
  --bg:#f7edf0; --surface:#fff8f9; --surface2:#f1dfe5; --ink:#2b1830; --dim:#6d5573;
  --line:rgba(43,24,48,.18); --rose:#b0435b; --gold:#9a6a17; --onaccent:#fff8f9;
  --wood:#b98f74; --wood2:#a98066; --felt:#ead3dc; --p0:#9a6a17; --p1:#b0435b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.top .who{font-family:var(--serif);font-size:1.15rem}
.top .who b{font-weight:600}
.top .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-height:44px}
.btn.primary{background:var(--rose);color:var(--onaccent);border-color:transparent;font-weight:600}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.danger{border-color:var(--rose);color:var(--rose)}
.p0{color:var(--p0)} .p1{color:var(--p1)}
b.p0,b.p1{font-weight:600}
.clock{color:var(--dim);font-size:.9rem}

/* board */
.board{display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);gap:4px;aspect-ratio:1;
  width:min(100%,calc(100dvh - 170px));max-width:720px;min-width:300px;margin:0 auto;padding:8px;border-radius:20px;
  background:repeating-linear-gradient(92deg,var(--wood) 0 22px,var(--wood2) 22px 24px);border:1px solid var(--line)}
.cell{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:clamp(9px,1.9vw,13px);font-weight:600;color:#fff;text-align:center;position:relative;min-width:0}
.cell.now{box-shadow:0 0 0 2px var(--gold) inset}
.t-home{background:#a0405a}.t-massage{background:#83557c}.t-dance{background:#b4566d}.t-gym{background:#b9764a}
.t-clinic{background:#4f7f7b}.t-spa{background:#46739a}.t-lounge{background:#6f5296}.t-chance{background:#c9a94f;color:#2a1430}
.toks{display:flex;gap:3px;min-height:12px}
.tok{width:clamp(9px,2vw,14px);height:clamp(9px,2vw,14px);border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tok.a{background:#e8b86d}.tok.b{background:#f2a0b0}
.center{grid-area:2/2/7/7;background:var(--felt);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:12px;text-align:center}
.center .turn{font-family:var(--serif);font-size:clamp(1.1rem,3.4vw,1.7rem)}
.center .hint{color:var(--dim);font-size:.9rem}
.dice{display:flex;gap:10px}
.die{width:54px;height:54px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--serif);font-size:1.7rem}
.roll{font-size:1.1rem;padding:14px 32px;min-height:52px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(12,4,16,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.scrim.sheetwrap{align-items:flex-end;padding:0}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(560px,100%);padding:22px 22px 18px;
  max-height:calc(100dvh - 32px);overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:min(680px,100%);padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));
  max-height:82dvh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.venue{color:var(--dim);font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--rose)}
.cardtext{font-family:var(--serif);font-size:clamp(1.35rem,4vw,1.85rem);line-height:1.3;margin:18px 0 22px}
.cardfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cardfoot .btns{display:flex;gap:8px;flex-wrap:wrap}
.never{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--dim);margin-left:auto;padding:6px 4px}
.never input{width:20px;height:20px;accent-color:var(--rose)}
.choices{display:grid;gap:10px;margin-top:16px}
.choices .btn{text-align:left;padding:14px 18px}
.choices small{display:block;color:var(--dim)}

/* controls */
.group{margin:0 0 16px}
.group h3{font-size:1.05rem;margin-bottom:6px}
.label{color:var(--dim);font-size:.9rem;margin:6px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:9px 16px;min-height:44px;min-width:44px}
.seg button.on{background:var(--rose);color:var(--onaccent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px}
.chip.on{background:var(--surface2);border-color:var(--gold);color:var(--ink)}
.chip.on::before{content:"✓ ";color:var(--gold)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
textarea{min-height:88px;resize:vertical}
.field{margin-bottom:12px}.field label{display:block;color:var(--dim);font-size:.9rem;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.panel h2{font-size:1.3rem;margin-bottom:10px}
.msg{color:var(--gold);font-size:.92rem;margin:8px 0;white-space:pre-wrap}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row .txt{flex:1;min-width:0}
.row .meta{color:var(--dim);font-size:.82rem}
.row.off .txt{opacity:.5}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.78rem;color:var(--dim);margin-right:6px}
.badge.hid{border-color:var(--rose);color:var(--rose)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.hero{font-family:var(--serif);font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;margin:8px 0 6px}
.sub{color:var(--dim);margin:0 0 18px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion: no-preference){.modal,.sheet{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
/* ============ data ============ */
const DEFAULT_CLOTHING=['top','bottoms','underwear','robe'];
const DEFAULT_TOYS=['massage_oil','ice','feather','blindfold','candle'];
const GENDERS=['female','male'];
const PASSION=['Tender','Warm','Heated','Intense','Fiery'];
const PACE={slow:0.6,steady:1,quick:1.8};
const VENUES={
  home:{name:'Home',short:'Home'},massage:{name:'Massage Studio',short:'Massage'},dance:{name:'Dance Hall',short:'Dance'},
  gym:{name:'Gym',short:'Gym'},clinic:{name:'Wellness Clinic',short:'Clinic'},spa:{name:'Spa Bath',short:'Spa'},
  lounge:{name:'Candlelit Lounge',short:'Lounge'},chance:{name:'Chance',short:'Chance'}
};
const BOARD_TYPES=['home','massage','dance','chance','gym','clinic','lounge','spa','massage','dance','chance','gym','clinic','lounge','spa','massage','dance','chance','gym','clinic','lounge','spa','chance','dance'];
const RING=[];
for(let c=0;c<7;c++)RING.push([0,c]);
for(let r=1;r<7;r++)RING.push([r,6]);
for(let c=5;c>=0;c--)RING.push([6,c]);
for(let r=5;r>=1;r--)RING.push([r,0]);

/* id, venue, intensity, min_minutes, performer_wearing, performer_not_wearing, recipient_wearing, recipient_not_wearing, toys, recipient_gender, text */
const SEED=[
['h01','home',1,0,'','','','','','',"Start with a minute of holding hands. {performer} shares one thing they're hoping for tonight."],
['h02','home',1,0,'','','','','','',"{performer} and {recipient} each name a favorite moment from this week."],
['m01','massage',1,0,'','','','','','',"{performer} gives {recipient} a 3-minute shoulder massage."],
['m02','massage',1,0,'','','','','','',"{performer} massages {recipient}'s hands, one minute each."],
['m03','massage',1,0,'','','','','','',"{performer} gives {recipient} a slow foot massage."],
['m04','massage',2,8,'','','','top','massage_oil','',"{performer} warms massage oil and rubs {recipient}'s back for five unhurried minutes."],
['m05','massage',2,5,'','','','','','',"{performer} massages {recipient}'s neck and scalp. {recipient} says when the pressure feels right."],
['m06','massage',3,15,'','','','top','','',"{performer} gives {recipient} a full back massage with long, slow strokes for five minutes."],
['m07','massage',2,6,'','','','','candle','',"{performer} drips warm massage-candle oil onto {recipient}'s shoulders and works it in."],
['d01','dance',1,0,'','','','','','',"{performer} leads {recipient} in a slow dance to the current song."],
['d02','dance',1,0,'','','','','','',"{recipient} picks the next song. {performer} asks for a dance."],
['d03','dance',2,5,'','','','','','',"Dance close for one full song. No talking, just eye contact."],
['d04','dance',2,8,'','','','','','',"{performer} whispers what they love most about {recipient} while you sway together."],
['d05','dance',3,15,'','','','','','',"{performer} dances just for {recipient} for one song while {recipient} watches and doesn't touch."],
['g01','gym',1,0,'','','','','','',"{performer} guides {recipient} through a slow arm and shoulder stretch."],
['g02','gym',1,0,'','','','','','',"Sit back to back and breathe together for one minute."],
['g03','gym',2,5,'','','','','','',"{performer} helps {recipient} stretch their legs, slowly and gently."],
['g04','gym',2,8,'','','','','','',"Play-wrestle for two minutes. The winner picks who gives on the next card."],
['g05','gym',2,10,'','','','','','',"{performer} picks up {recipient} for a hug, if it's comfortable, and holds them for ten seconds."],
['c01','clinic',1,0,'','','','','','',"{performer} takes {recipient}'s pulse at the wrist, then reports the result in a very serious voice."],
['c02','clinic',1,0,'','','','','','',"{performer} writes {recipient} a prescription: ten kisses, filled immediately."],
['c03','clinic',2,6,'','','','','','',"{performer} 'examines' {recipient} with fingertips only, very slowly, from head to toe."],
['c04','clinic',2,10,'','','','','feather','',"{performer} traces a feather along {recipient}'s arms and neck to test their reflexes."],
['c05','clinic',3,15,'','','','','blindfold','',"{recipient} wears a blindfold. {performer} tests their reflexes with different touches and {recipient} guesses each one."],
['s01','spa',1,0,'','','','','','',"{performer} washes and dries {recipient}'s hands gently."],
['s02','spa',1,0,'','','','','','',"Take turns brushing each other's hair for one minute."],
['s03','spa',2,5,'','','','','','',"{performer} kisses {recipient}'s neck and shoulders for two minutes."],
['s04','spa',2,8,'','','','','ice','',"{performer} slowly traces an ice cube along {recipient}'s arm."],
['s05','spa',3,15,'','','','','','',"Share a long, slow kiss and don't stop until the song changes."],
['l01','lounge',1,0,'','','','','','',"Each of you shares your favorite memory of the two of you."],
['l02','lounge',1,0,'','','','','','',"Trade three compliments each. No repeats."],
['l03','lounge',1,0,'','','','','','',"{performer} feeds {recipient} something sweet, if there's anything nearby."],
['l04','lounge',2,6,'','','','','','',"{performer} kisses {recipient} anywhere {recipient} chooses, for one minute."],
['l05','lounge',3,15,'','','underwear','','','',"{performer} slowly slips off {recipient}'s underwear."],
['l06','lounge',3,15,'','','top','','','',"{performer} slowly takes off {recipient}'s top."],
['l07','lounge',2,8,'','','','','candle','',"Light the candle and share a slow kiss by its glow."],
['x01','chance',1,0,'','','','','','',"Pick a song for the two of you and stay close until it ends."],
['x02','chance',1,0,'','','','','','',"{performer} whispers a secret compliment in {recipient}'s ear."],
['x03','chance',2,5,'','','','','','',"{recipient} asks for a kiss anywhere for one minute. {performer} delivers."],
['x04','chance',2,10,'','','','','','',"Hold each other for two minutes with no talking."],
['g06','gym',2,10,'','','','','','male',"{performer} traces fingers slowly along {recipient}'s chest and shoulders."],
['g07','gym',2,10,'','','','','','female',"{performer} traces fingers slowly along {recipient}'s collarbone and shoulders."]
];
const FALLBACK={id:'_fallback',venue:'any',intensity:1,min_minutes:0,pw:[],pnw:[],rw:[],rnw:[],toys:[],rg:[],enabled:true,
  text:"Take a moment. {performer} tells {recipient} one thing they appreciated today."};

const COLS=['id','venue','text','intensity','min_minutes','performer_wearing','performer_not_wearing','recipient_wearing','recipient_not_wearing','toys','recipient_gender','enabled'];

/* ============ storage ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const tags=v=>String(v||'').split(/[|,;]/).map(t=>t.trim().toLowerCase().replace(/\s+/g,'_')).filter(Boolean);
const label=t=>t.replace(/_/g,' ');
let uid=0;const newId=()=>'u'+Date.now().toString(36)+(uid++).toString(36);

function mk(o){
  const en=String(o.enabled===undefined?'1':o.enabled).trim().toLowerCase();
  return {id:String(o.id||newId()).trim(),venue:String(o.venue||'any').trim().toLowerCase(),text:String(o.text||'').trim(),
    intensity:Math.min(5,Math.max(1,parseInt(o.intensity)||1)),min_minutes:Math.max(0,parseInt(o.min_minutes)||0),
    pw:tags(o.pw),pnw:tags(o.pnw),rw:tags(o.rw),rnw:tags(o.rnw),toys:tags(o.toys),
    rg:tags(o.rg).filter(g=>GENDERS.includes(g)),
    enabled:!['0','false','no','off'].includes(en)};
}
function seedActions(){return SEED.map(r=>mk({id:r[0],venue:r[1],intensity:r[2],min_minutes:r[3],pw:r[4],pnw:r[5],rw:r[6],rnw:r[7],toys:r[8],rg:r[9],text:r[10]}))}

let ACTIONS=load('lb.actions.v1',null)||seedActions();
let HIDDEN=new Set(load('lb.hidden.v1',[]));
const saveActions=()=>save('lb.actions.v1',ACTIONS);
const saveHidden=()=>save('lb.hidden.v1',[...HIDDEN]);

function newState(){return {names:['Player 1','Player 2'],wearing:[['top','bottoms','underwear'],['top','bottoms','underwear']],
  genders:['female','male'],passion:[2,2],toys:[],pace:'steady',pos:0,turn:0,elapsed:0,started:false,recent:[]}}
let S=Object.assign(newState(),load('lb.state.v1',{}));
const saveState=()=>save('lb.state.v1',S);
const ui={screen:S.started?'game':'setup',phase:'idle',dice:null,card:null,panel:false,lib:{venue:'',q:'',show:'all'},libMsg:''};

const allClothing=()=>[...new Set([...DEFAULT_CLOTHING,...ACTIONS.flatMap(a=>[...a.pw,...a.pnw,...a.rw,...a.rnw])])];
const allToys=()=>[...new Set([...DEFAULT_TOYS,...ACTIONS.flatMap(a=>a.toys)])];

/* ============ engine ============ */
const effMinutes=()=>(S.elapsed/60)*PACE[S.pace];
const cap=()=>Math.min(Math.min(...S.passion),1+Math.floor(effMinutes()/8));
function pool(space,perf,relax){
  const rec=1-perf,eff=effMinutes(),c=cap(),toys=new Set(S.toys),wp=new Set(S.wearing[perf]),wr=new Set(S.wearing[rec]);
  return ACTIONS.filter(a=>{
    if(!a.enabled||HIDDEN.has(a.id))return false;
    if(!relax){
      if(space==='chance'){if(a.venue==='home')return false}
      else if(a.venue!==space&&a.venue!=='any')return false;
    }
    if(a.intensity>c||a.min_minutes>eff)return false;
    if(!a.pw.every(t=>wp.has(t))||a.pnw.some(t=>wp.has(t)))return false;
    if(!a.rw.every(t=>wr.has(t))||a.rnw.some(t=>wr.has(t)))return false;
    if(a.rg.length&&!a.rg.includes(S.genders[rec]))return false;
    return a.toys.every(t=>toys.has(t));
  });
}
function drawCard(space,perf){
  let p=pool(space,perf,false);
  if(!p.length&&space==='home')p=pool('lounge',perf,false);
  if(!p.length)p=pool(space,perf,true);
  const fresh=p.filter(a=>!S.recent.includes(a.id));
  if(fresh.length)p=fresh;
  let pick=FALLBACK;
  if(p.length){
    const c=cap(),w=p.map(a=>1+(a.intensity===c?2:a.intensity===c-1?1:0));
    let r=Math.random()*w.reduce((x,y)=>x+y,0);
    for(let i=0;i<p.length;i++){r-=w[i];if(r<=0){pick=p[i];break}}
    if(pick===FALLBACK)pick=p[p.length-1];
  }
  if(pick.id!=='_fallback'){S.recent.push(pick.id);S.recent=S.recent.slice(-10);saveState()}
  return {a:pick,space,perf};
}
const fmt=(text,perf)=>esc(text)
  .replace(/\{performer\}/g,`<b class="p${perf}">${esc(S.names[perf])}</b>`)
  .replace(/\{recipient\}/g,`<b class="p${1-perf}">${esc(S.names[1-perf])}</b>`);

/* ============ dice sound ============ */
function playDiceSound(){
  try{
    const ctx=playDiceSound._ctx||(playDiceSound._ctx=new (window.AudioContext||window.webkitAudioContext)());
    if(ctx.state==='suspended')ctx.resume();
    const now=ctx.currentTime,clicks=6+Math.floor(Math.random()*3);
    for(let i=0;i<clicks;i++){
      const t=now+i*0.045+Math.random()*0.02;
      const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.03),ctx.sampleRate);
      const data=buf.getChannelData(0);
      for(let j=0;j<data.length;j++)data[j]=(Math.random()*2-1)*Math.pow(1-j/data.length,2);
      const src=ctx.createBufferSource();src.buffer=buf;
      const gain=ctx.createGain();gain.gain.value=0.25*(1-i/clicks*0.5);
      const filt=ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=1200+Math.random()*800;
      src.connect(filt);filt.connect(gain);gain.connect(ctx.destination);
      src.start(t);
    }
  }catch(e){}
}

/* ============ music ============ */
function idbOpen(){return new Promise((res,rej)=>{
  if(!('indexedDB' in window)){rej(new Error('no indexeddb'));return}
  const req=indexedDB.open('lb-music-v1',1);
  req.onupgradeneeded=()=>{req.result.createObjectStore('tracks',{keyPath:'id'})};
  req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);
})}
const idbAll=()=>idbOpen().then(db=>new Promise((res,rej)=>{const rq=db.transaction('tracks','readonly').objectStore('tracks').getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}));
const idbPut=rec=>idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction('tracks','readwrite');tx.objectStore('tracks').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}));
const idbDel=id=>idbOpen().then(db=>new Promise((res,rej)=>{const tx=db.transaction('tracks','readwrite');tx.objectStore('tracks').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)}));

    if((!MUSIC.selected||!MUSIC.tracks.some(t=>t.id===MUSIC.selected))&&MUSIC.tracks.length)MUSIC.selected=MUSIC.tracks[0].id;

  }).catch(()=>{MUSIC.ready=true});
}
function addTracks(files){
  const jobs=[...files].map(f=>{const id=newId();return idbPut({id,name:f.name,blob:f}).then(()=>MUSIC.tracks.push({id,name:f.name,blob:f}))});
  Promise.all(jobs).then(()=>{
    if(!MUSIC.selected&&MUSIC.tracks.length){MUSIC.selected=MUSIC.tracks[0].id;save('lb.music.selected',MUSIC.selected)}
    refreshControls();
  });
}
function removeTrack(id){
  idbDel(id).catch(()=>{});
  MUSIC.tracks=MUSIC.tracks.filter(t=>t.id!==id);
  if(MUSIC.selected===id){MUSIC.selected=MUSIC.tracks[0]?MUSIC.tracks[0].id:null;save('lb.music.selected',MUSIC.selected)}
  if(!MUSIC.tracks.length){AUDIO.pause();MUSIC.playing=false}
  refreshControls();

function currentTrack(){
  if(!MUSIC.tracks.length)return null;
  if(MUSIC.mode==='repeat-one')return MUSIC.tracks.find(t=>t.id===MUSIC.selected)||MUSIC.tracks[0];
  return MUSIC.tracks[MUSIC.idx%MUSIC.tracks.length];
}
function playCurrentTrack(){
  const t=currentTrack();if(!t)return;
  if(MUSIC.url)URL.revokeObjectURL(MUSIC.url);
  MUSIC.url=URL.createObjectURL(t.blob);
  AUDIO.src=MUSIC.url;AUDIO.loop=(MUSIC.mode==='repeat-one');
  AUDIO.play().then(()=>{MUSIC.playing=true;refreshControls()}).catch(()=>{MUSIC.playing=false;refreshControls()});
}
function toggleMusic(){
  if(!MUSIC.tracks.length)return;
  if(MUSIC.playing){AUDIO.pause();MUSIC.playing=false;refreshControls()}
  else playCurrentTrack();
}
AUDIO.addEventListener('ended',()=>{
  if(MUSIC.mode==='loop-all'&&MUSIC.tracks.length){MUSIC.idx=(MUSIC.idx+1)%MUSIC.tracks.length;playCurrentTrack()}
});

/* ============ csv ============ */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const q=v=>{v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCSV(list){
  const lines=[COLS.join(',')];
  list.forEach(a=>lines.push([a.id,a.venue,a.text,a.intensity,a.min_minutes,a.pw.join('|'),a.pnw.join('|'),a.rw.join('|'),a.rnw.join('|'),a.toys.join('|'),a.rg.join('|'),a.enabled?1:0].map(q).join(',')));
  return lines.join('\n');
}
function importCSV(text,replace){
  const rows=parseCSV(text);
  if(rows.length<2)return 'Nothing to import. The first row must be the column headers, followed by at least one card.';
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix=n=>h.indexOf(n);
  if(ix('text')<0)return 'Missing a "text" column. Expected columns: '+COLS.join(', ');
  const warn=[];let add=0,upd=0;const incoming=[];
  rows.slice(1).forEach((r,n)=>{
    const g=name=>ix(name)>=0?(r[ix(name)]||''):'';
    if(!g('text').trim()){warn.push('Row '+(n+2)+': no text, skipped.');return}
    const a=mk({id:g('id'),venue:g('venue')||'any',text:g('text'),intensity:g('intensity'),min_minutes:g('min_minutes'),
      pw:g('performer_wearing'),pnw:g('performer_not_wearing'),rw:g('recipient_wearing'),rnw:g('recipient_not_wearing'),toys:g('toys'),rg:g('recipient_gender'),enabled:ix('enabled')>=0?g('enabled')||'1':'1'});
    if(a.venue!=='any'&&!VENUES[a.venue])warn.push('Row '+(n+2)+': unknown venue "'+a.venue+'". Use one of: '+Object.keys(VENUES).join(', ')+', any.');
    incoming.push(a);
  });
  if(replace){ACTIONS=incoming;add=incoming.length}
  else incoming.forEach(a=>{const i=ACTIONS.findIndex(x=>x.id===a.id);if(i>=0){ACTIONS[i]=a;upd++}else{ACTIONS.push(a);add++}});
  saveActions();
  return (replace?'Replaced library with ':'Imported ')+add+' new'+(upd?', '+upd+' updated':'')+' card'+(add+upd===1?'':'s')+'.'+(warn.length?'\n'+warn.slice(0,6).join('\n'):'');
}

function endCard(hideIt){

function move(steps){
  ui.phase='moving';renderBoard();renderLayer();
  const t=setInterval(()=>{
    S.pos=(S.pos+1)%BOARD_TYPES.length;steps--;saveState();renderBoard();
    if(steps<=0){clearInterval(t);ui.phase='choose';renderBoard();renderLayer()}
  },150);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,v=el.dataset.v,k=el.dataset.k;
  switch(act){
    case 'seg':
      if(k==='pace')S.pace=v;
      else if(k.startsWith('passion:'))S.passion[+k.split(':')[1]]=+v;
      else if(k.startsWith('gender:'))S.genders[+k.split(':')[1]]=v;
      saveState();refreshControls();break;
    case 'chip':{
      const arr=k==='toy'?S.toys:S.wearing[+k.split(':')[1]];const i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1);else arr.push(v);saveState();refreshControls();break}
    case 'start':
      S.pos=0;S.turn=0;S.elapsed=0;S.recent=[];S.started=true;saveState();ui.dice=null;ui.phase='idle';ui.screen='game';render();break;
    case 'goto':ui.screen=v;ui.panel=false;render();break;
    case 'panel':ui.panel=!ui.panel;renderLayer();break;
    case 'ff':S.elapsed+=600;saveState();updateClock();break;
    case 'roll':{
      playDiceSound();
      ui.dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
      move(ui.dice[0]+ui.dice[1]);break}
    case 'role':{
      let perf=v==='give'?S.turn:v==='receive'?1-S.turn:(Math.random()<.5?S.turn:1-S.turn);
      ui.card=drawCard(BOARD_TYPES[S.pos],perf);ui.phase='card';renderLayer();break}
    case 'done':
      endCard();S.turn=1-S.turn;saveState();ui.card=null;ui.phase='idle';ui.dice=null;renderBoard();renderLayer();break;
    case 'skip':{
      endCard();const c=ui.card;ui.card=drawCard(c.space,c.perf);renderLayer();break}
    case 'reverse':{
      endCard();const c=ui.card;ui.card=drawCard(c.space,1-c.perf);renderLayer();break}
    case 'addcard':{
      const g=id=>$('#'+id).value;
      if(!g('f-text').trim()){$('#addmsg').textContent='Write the card text first.';break}
      const rg=[$('#f-gf').checked?'female':'',$('#f-gm').checked?'male':''].filter(Boolean).join('|');
      ACTIONS.push(mk({venue:g('f-venue'),intensity:g('f-int'),text:g('f-text'),min_minutes:g('f-min'),toys:g('f-toys'),pw:g('f-pw'),pnw:g('f-pnw'),rw:g('f-rw'),rnw:g('f-rnw'),rg}));
      saveActions();['f-text','f-toys','f-pw','f-pnw','f-rw','f-rnw'].forEach(id=>$('#'+id).value='');$('#f-min').value=0;$('#f-gf').checked=false;$('#f-gm').checked=false;
      $('#addmsg').textContent='Card added.';renderLibList();break}
    case 'csvexport':$('#csvbox').value=toCSV(ACTIONS);$('#csvmsg').textContent='CSV of '+ACTIONS.length+' cards is in the box. Select all and copy, or use Download.';break;
    case 'csvdownload':{
      try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toCSV(ACTIONS)],{type:'text/csv'}));a.download='cards.csv';document.body.appendChild(a);a.click();a.remove();
        $('#csvmsg').textContent='If nothing downloaded, use Show CSV of library and copy it from the box.'}catch(err){$('#csvmsg').textContent='Download is not available here. Use Show CSV of library and copy from the box.'}break}
    case 'csvmerge':ui.libMsg=importCSV($('#csvbox').value,false);$('#csvmsg').textContent=ui.libMsg;renderLibList();break;
    case 'csvreplace':ui.libMsg=importCSV($('#csvbox').value,true);$('#csvmsg').textContent=ui.libMsg;renderLibList();break;
    case 'libshow':ui.lib.show=v;renderLibrary();break;
    case 'unhide':HIDDEN.delete(v);saveHidden();renderLibList();break;
    case 'unhideall':HIDDEN.clear();saveHidden();renderLibList();break;
    case 'toggle':{const a=ACTIONS.find(x=>x.id===v);if(a){a.enabled=!a.enabled;saveActions();renderLibList()}break}
    case 'del':ACTIONS=ACTIONS.filter(x=>x.id!==v);HIDDEN.delete(v);saveActions();saveHidden();renderLibList();break;
    case 'resetseed':ACTIONS=seedActions();saveActions();renderLibList();break;
    case 'musicmode':MUSIC.mode=v;save('lb.music.mode',v);if(MUSIC.playing)playCurrentTrack();else refreshControls();break;
    case 'musictoggle':toggleMusic();break;
    case 'musicdel':removeTrack(v);break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.dataset.name!==undefined){S.names[+e.target.dataset.name]=e.target.value||('Player '+(+e.target.dataset.name+1));saveState()}
  if(e.target.dataset.lib){ui.lib[e.target.dataset.lib]=e.target.value;renderLibList()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='csvfile'&&e.target.files[0]){
    const fr=new FileReader();fr.onload=()=>{$('#csvbox').value=fr.result;$('#csvmsg').textContent='File loaded. Choose Import and merge, or Import and replace.'};fr.readAsText(e.target.files[0]);
  }
  if(e.target.id==='musicfile'&&e.target.files.length)addTracks(e.target.files);
  if(e.target.id==='music-track'){MUSIC.selected=e.target.value;save('lb.music.selected',MUSIC.selected);if(MUSIC.playing)playCurrentTrack()}
});
setInterval(()=>{if(ui.screen==='game'&&S.started&&!document.hidden){S.elapsed+=5;saveState();updateClock()}},5000);

render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
</script>
</body>
</html>
